<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>


</head>
<body>
  <div class="container">   
      <div class="left-card">
        <h1>Your Result</h1>
            <div class="score-circle">
              <div class="score1" class="total">76</div> 
              <div class="out-of-mark">of 100</div>
            </div>
             <h2>Great</h2>
             <p> You scored higher than 65% of <br> the people who have taken <br> these tests.</p>  
      </div>
     
      <div class="right-card">
        <h1>Summary</h1>

            <div class="summary-item reaction">
              <div class="label"><img src="assets/images/icon-reaction.svg" alt="reaction-icon"> <span>Reaction</span></div>
              <span><span class="score2">80</span> <span class="total"> / 100</span></span>
            </div>
            <div class="summary-item memory">
              <div class="label"><img src="assets/images/icon-memory.svg" alt="memory-icon"> <span>Memory</span></div>
              <span><span class="score2">92</span> <span class="total"> / 100</span></span>
            </div>
            <div class="summary-item verbal">
              <div class="label"><img src="assets/images/icon-verbal.svg" alt="verbal-icon"> <span>Verbal</span></div>
              <span><span class="score2">61</span> <span class="total"> / 100</span></span>
            </div>
            <div class="summary-item visual">
              <div class="label"><img src="assets/images/icon-visual.svg" alt="visual-icon"> <span>Visual</span></div>
              <span><span class="score2">73</span> <span class="total"> / 100</span></span>
            </div>
            <button id="continue-btn" disabled>Continue</button>
      </div>
  </div>

  <script src="index.js"></script>

</body>
</html>
